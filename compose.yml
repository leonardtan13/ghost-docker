services:
  mysql8:
    image: docker.io/mysql:8.4
    environment:
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_pw
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_pw
      MYSQL_MULTIPLE_DATABASES: activitypub
    secrets:
      - mysql_root_pw
      - mysql_app_pw
    volumes:
      - ghost_mysql:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
      - backup_staging:/backup
    labels:
      - docker-volume-backup.archive-pre=/bin/sh -c 'mysqldump -uroot -p$$(cat /run/secrets/mysql_root_pw) --all-databases --single-transaction --routines --triggers > /backup/dump.sql && echo "Database dump completed"'
      - docker-volume-backup.archive-post=/bin/sh -c 'rm -f /backup/dump.sql && echo "Dump cleanup completed"'
    networks: [ghost-net]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -uroot -p$$(cat /run/secrets/mysql_root_pw) || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    expose:
      - "3306"

  ghost:
    image: docker.io/ghost:6.72.0-alpine
    expose:
      - "2368"
    depends_on:
      mysql8:
        condition: service_healthy
      tinybird-sync:
        condition: service_completed_successfully
        required: false
      tinybird-deploy:
        condition: service_completed_successfully
        required: false
      activitypub:
        condition: service_started
        required: false

    environment:
      url: https://blog.leonardtgm.com
      NODE_ENV: production
      database__client: mysql
      database__connection__host: mysql8
      database__connection__user: ghost
      database__connection__password: ${MYSQL_APP_PASSWORD}
      database__connection__database: ghost
      tinybird__tracker__endpoint: https://blog.leonardtgm.com/.ghost/analytics/api/v1/page_hit
      tinybird__adminToken: ${TINYBIRD_ADMIN_TOKEN:-}
      tinybird__workspaceId: ${TINYBIRD_WORKSPACE_ID:-}
      tinybird__tracker__datasource: analytics_events
      tinybird__stats__endpoint: ${TINYBIRD_API_URL:-https://api.tinybird.co}
      mail__transport: ${mail__transport:-}
      mail__options__host: ${mail__options__host:-}
      mail__options__port: ${mail__options__port:-}
      mail__options__secure : ${mail__options__secure:-}
      mail__options__auth__user: ${mail__options__auth__user:-}
      mail__options__auth__pass : ${mail__options__auth__pass:-}
      mail__from: ${mail__from:-}
    volumes:
      - ghost_content:/var/lib/ghost/content
    networks: [ghost-net]
    restart: unless-stopped

  caddy:
    image: docker.io/caddy:2-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    expose:
      - "8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      ghost:
        condition: service_started
    networks: [ghost-net]
    restart: unless-stopped

  cloudflared:
    image: docker.io/cloudflare/cloudflared:2026.10.2
    depends_on:
      caddy:
        condition: service_started
    command: ["tunnel", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    networks: [ghost-net]
    restart: unless-stopped

  traffic-analytics:
    build:
      context: ./docker
      dockerfile: Dockerfile.security
      target: node-runtime
      args:
        APP_IMAGE: ghost/traffic-analytics:1.0.494@sha256:050c1ff676a1463475d7096e2d364b8f8972ef429bcfeca7d7b762bf7ab65a16
        NODE_VERSION: 26.12.1
    restart: always
    expose:
      - "3000"
    volumes:
      - traffic_analytics_data:/data
    environment:
      NODE_ENV: production
      PROXY_TARGET: ${TINYBIRD_API_URL:-https://api.tinybird.co}/v0/events
      SALT_STORE_TYPE: ${SALT_STORE_TYPE:-file}
      SALT_STORE_FILE_PATH: /data/salts.json
      TINYBIRD_TRACKER_TOKEN: ${TINYBIRD_TRACKER_TOKEN:-}
      LOG_LEVEL: debug
    profiles: [analytics]
    networks: [ghost-net]

  activitypub:
    build:
      context: ./docker
      dockerfile: Dockerfile.security
      target: node-runtime
      args:
        APP_IMAGE: ghcr.io/tryghost/activitypub:1.2.15@sha256:24b48f68837f01b7adec5eaf8519af504189c441656e9c12ef0976d7953f8935
        NODE_VERSION: 24.22.1
    expose:
      - "8080"
    volumes:
      - ghost_content:/opt/activitypub/content
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql8
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_DATABASE: activitypub
      LOCAL_STORAGE_PATH: /opt/activitypub/content/images/activitypub
      LOCAL_STORAGE_HOSTING_URL: https://blog.leonardtgm.com/content/images/activitypub
      GHOST_URL: http://caddy:8080
    depends_on:
      mysql8:
        condition: service_healthy
      activitypub-migrate:
        condition: service_completed_successfully
    profiles: [activitypub]
    networks: [ghost-net]
    restart: unless-stopped

  activitypub-migrate:
    image: ghcr.io/tryghost/activitypub-migrations:1.2.15@sha256:c6c6f9160b39bfcdb1fad0a7fca8bac05ad45a7393290a2e9cdcc4b6f1fd00be
    environment:
      MYSQL_DB: mysql://ghost:${MYSQL_APP_PASSWORD}@tcp(mysql8:3306)/activitypub
    networks: [ghost-net]
    depends_on:
      mysql8:
        condition: service_healthy
    profiles: [activitypub]
    restart: "no"

  tinybird-login:
    build:
      context: ./tinybird
      dockerfile: Dockerfile
    working_dir: /home/tinybird
    command: /usr/local/bin/tinybird-login
    volumes:
      - tinybird_home:/home/tinybird
      - tinybird_files:/data/tinybird
    profiles: [analytics]
    networks: [ghost-net]
    tty: false
    restart: "no"

  tinybird-sync:
    image: docker.io/ghost:6.72.0-alpine
    command: >
      sh -c "
        if [ -d /var/lib/ghost/current/core/server/data/tinybird ]; then
          rm -rf /data/tinybird/*;
          cp -rf /var/lib/ghost/current/core/server/data/tinybird/* /data/tinybird/;
          echo 'Tinybird files synced into shared volume.';
        else
          echo 'Tinybird source directory not found.';
        fi
      "
    volumes:
      - tinybird_files:/data/tinybird
    depends_on:
      tinybird-login:
        condition: service_completed_successfully
    networks:
      - ghost-net
    profiles: [analytics]
    restart: "no"

  tinybird-deploy:
    build:
      context: ./tinybird
      dockerfile: Dockerfile
    working_dir: /data/tinybird
    command: >
      sh -c "
        tb-wrapper --cloud deploy --allow-destructive-operations
      "
    volumes:
      - tinybird_home:/home/tinybird
      - tinybird_files:/data/tinybird
    depends_on:
      tinybird-sync:
        condition: service_completed_successfully
    profiles: [analytics]
    networks:
      - ghost-net
    tty: true
    restart: "no"

  backup:
    build:
      context: ./docker
      dockerfile: Dockerfile.security
      target: certificates
      args:
        APP_IMAGE: offen/docker-volume-backup:v2@sha256:6630d1f122f42ada84566550e47647d2e7488ac3775176ee654b64e489ab6e40
    environment:
      BACKUP_CRON_EXPRESSION: "0 2 * * *"
      AWS_ENDPOINT: ${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      AWS_S3_BUCKET_NAME: ${R2_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      BACKUP_FILENAME: ghost-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: ghost-backup-
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      EXEC_FORWARD_OUTPUT: "true"
    volumes:
      - backup_staging:/backup/mysql:ro
      - ghost_content:/backup/content:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      mysql8:
        condition: service_healthy
    profiles: [backup]
    networks: [ghost-net]
    restart: unless-stopped

volumes:
  ghost_content:
  ghost_mysql:
  tinybird_files:
  tinybird_home:
  traffic_analytics_data:
  backup_staging:

secrets:
  mysql_root_pw:
    file: ./secrets/mysql_root_pw.txt
  mysql_app_pw:
    file: ./secrets/mysql_app_pw.txt

networks:
  ghost-net:
    driver: bridge
